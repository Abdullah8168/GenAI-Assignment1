# One command:  docker compose up --build
#   App:     http://localhost:8080
#   API:     http://localhost:8000/docs
#   MLflow:  http://localhost:5000
# Trained models are read from ./outputs (unzip outputs.zip from the training run there).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./outputs/onnx:/models/onnx:ro
      - ./outputs/samples:/models/samples:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: tools/mlflow.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./outputs/mlruns:/mlruns
    restart: unless-stopped
